name: Build Windows installer

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CI: "true"
      PIP_NO_CACHE_DIR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: pip
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress --yes
      - name: Download FFmpeg for bundling
        shell: powershell
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-release-essentials.zip"
          $expanded = Join-Path $env:RUNNER_TEMP "ffmpeg-release-essentials"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $expanded -Force
          $ffmpeg = Get-ChildItem -Path $expanded -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          if (-not $ffmpeg) { throw "ffmpeg.exe was not present in the archive." }
          Copy-Item $ffmpeg.FullName -Destination "ffmpeg.exe"
      - name: Build application
        shell: cmd
        run: call build_windows.bat
      - name: Build installer
        shell: cmd
        run: call build_installer.bat
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ScriptureSoundQC-v4.0-Beta-Windows
          path: dist/installer/ScriptureSoundQC-Setup-v4.0-Beta.exe
          if-no-files-found: error
          retention-days: 30
