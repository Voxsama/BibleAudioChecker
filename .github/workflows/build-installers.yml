name: Build installers

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  version:
    # The release tag comes from APP_UPDATE_VERSION in gui/theme.py. Pushing a
    # new version to main publishes it automatically; no manual tagging needed.
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"; publish=true
          else
            version=$(sed -n 's/^APP_UPDATE_VERSION = "\([^"]*\)".*/\1/p' gui/theme.py)
            tag="v$version"; publish=false
            if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" == "main" ]] \
               && ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              publish=true
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Release tag $tag, publish=$publish"

  test:
    name: Full test suite
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libopengl0 libxcb-cursor0 libxcb-xinerama0 libxkbcommon-x11-0 libasound2
      - name: Install Python packages (CPU torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Engine self-check scripts
        run: |
          for t in test_engine test_mastering_validation test_production_features test_reworked_features; do
            python -m tests.$t
          done

  build:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    needs: version
    if: needs.version.outputs.publish == 'true' || github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
            arch: x86_64
            directory: dist/installer
          - runner: macos-15
            platform: macos
            arch: apple-silicon
            directory: dist-mac
          - runner: macos-15-intel
            platform: macos
            arch: intel
            directory: dist-mac
          - runner: ubuntu-22.04
            platform: linux
            arch: x86_64
            directory: dist-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CI: "true"
      PIP_NO_CACHE_DIR: "1"
      MAC_ARCH_LABEL: ${{ matrix.arch }}
      RELEASE_TAG: ${{ needs.version.outputs.publish == 'true' && needs.version.outputs.tag || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test installer helpers
        run: python -m unittest discover -s tests -p test_installer_editions.py -v
      - name: Install Windows build tools
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          choco install innosetup --no-progress --yes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $expanded = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $expanded -Force
          $ffmpeg = Get-ChildItem -Path $expanded -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          if (-not $ffmpeg) { throw "ffmpeg.exe was not present in the archive." }
          Copy-Item $ffmpeg.FullName -Destination "ffmpeg.exe"
      - name: Install Linux build tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libopengl0 libxcb-cursor0 libxcb-xinerama0 libxkbcommon-x11-0 libasound2
      - name: Build Windows offline installer
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          call build_windows.bat
          if errorlevel 1 exit /b 1
          call build_installer.bat
          if errorlevel 1 exit /b 1
          copy dist-beta\ScriptureSoundQC-Windows-dependencies.txt dist\installer\
      - name: Build macOS offline installer
        if: matrix.platform == 'macos'
        run: bash build_mac.sh
      - name: Build Linux offline installer
        if: matrix.platform == 'linux'
        run: bash build_linux.sh
      - name: Build online edition
        env:
          PLATFORM: ${{ matrix.platform }}
          OUTPUT_DIRECTORY: ${{ matrix.directory }}
        shell: python
        run: |
          import os
          import sys
          from pathlib import Path
          from urllib.parse import quote
          # Actions executes this file from RUNNER_TEMP, outside the checkout.
          sys.path.insert(0, os.environ['GITHUB_WORKSPACE'])
          from scripts.build_online_installer import build
          # Untagged builds get a deliberately unpublished URL for local smoke tests.
          # Only tagged artifacts should be distributed as working online installers.
          tag = os.environ.get('RELEASE_TAG') or 'unpublished-' + os.environ['GITHUB_SHA']
          base = 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/releases/download/' + quote(tag, safe='')
          payload, = Path(os.environ['OUTPUT_DIRECTORY']).glob('*-Offline.*')
          print(build(payload, base, os.environ['PLATFORM']))
      - name: Smoke test Linux offline installation
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/installer-smoke-test"
          bash dist-linux/*-Offline.sh
          test -f "$XDG_DATA_HOME/applications/scripturesound-qc.desktop"
          QT_QPA_PLATFORM=offscreen "$XDG_DATA_HOME/scripturesound-qc/app/ScriptureSoundQC" --packaging-self-test
      - name: Smoke test Windows offline installation
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "installer-smoke-test"
          $setup = Get-ChildItem dist/installer/*-Offline.exe | Select-Object -First 1
          $process = Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$destination`"" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Offline Setup failed: $($process.ExitCode)" }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $process = Start-Process "$destination/ScriptureSoundQC.exe" -ArgumentList '--packaging-self-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Installed runtime self-test failed' }
      - name: Upload both editions
        uses: actions/upload-artifact@v4
        with:
          name: ScriptureSoundQC-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ matrix.directory }}/*-Offline.*
            ${{ matrix.directory }}/*-Online.*
            ${{ matrix.directory }}/*-dependencies.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish all installer editions together
    if: needs.version.outputs.publish == 'true'
    needs: [version, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ScriptureSoundQC-*
          path: release-assets
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Refuse to replace hash-pinned payloads. Publish fixes under a new tag.
            gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY"
          else
            flags=()
            if [[ "$TAG" == *beta* || "$TAG" == *alpha* || "$TAG" == *rc* ]]; then
              date="${TAG#v}"; date="${date%%-*}"
              flags+=(--prerelease --title "ScriptureSoundQC Beta $date")
            fi
            # --target creates the tag on this commit when it does not exist yet.
            gh release create "$TAG" release-assets/* --target "$GITHUB_SHA" --generate-notes "${flags[@]}" --repo "$GITHUB_REPOSITORY"
          fi
