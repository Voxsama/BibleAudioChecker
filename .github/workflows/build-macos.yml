name: Build macOS PKG

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: apple-silicon
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    env:
      PIP_NO_CACHE_DIR: "1"
      MAC_ARCH_LABEL: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: brew install ffmpeg
      - name: Build app and PKG
        run: bash build_mac.sh
      - name: Upload PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScriptureSoundQC-macOS-${{ matrix.arch }}
          path: dist-mac/*.pkg
          if-no-files-found: error

  attach-to-release:
    name: Attach packages to tagged release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ScriptureSoundQC-macOS-*
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/*.pkg --clobber --repo "$GITHUB_REPOSITORY"
          elif [[ "$TAG" == *beta* || "$TAG" == *alpha* || "$TAG" == *rc* ]]; then
            gh release create "$TAG" release-assets/*.pkg --verify-tag --prerelease --generate-notes --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release-assets/*.pkg --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
